name: Limpar Deployments Falhos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  deployments: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Limpar Deployments com Falha
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            console.log(`Buscando deployments para ${owner}/${repo}...`);
            
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner,
              repo,
              per_page: 100
            });
            
            console.log(`Total de deployments encontrados: ${deployments.length}`);
            let removidos = 0;
            
            for (const d of deployments) {
              try {
                const statuses = await github.rest.repos.listDeploymentStatuses({
                  owner,
                  repo,
                  deployment_id: d.id,
                  per_page: 5
                });
                
                const latest = statuses.data.length > 0 ? statuses.data[0].state : 'none';
                console.log(`Deployment ${d.id} (${d.environment}): status = ${latest}`);
                
                if (latest === 'failure' || latest === 'error') {
                  console.log(`-> Marcando deployment ${d.id} como inativo...`);
                  try {
                    await github.rest.repos.createDeploymentStatus({
                      owner,
                      repo,
                      deployment_id: d.id,
                      state: 'inactive'
                    });
                  } catch (e) {
                    console.log(`Aviso ao inativar ${d.id}: ${e.message}`);
                  }
                  
                  console.log(`-> Excluindo deployment ${d.id}...`);
                  await github.rest.repos.deleteDeployment({
                    owner,
                    repo,
                    deployment_id: d.id
                  });
                  console.log(`✓ Deployment ${d.id} excluído com sucesso!`);
                  removidos++;
                }
              } catch (err) {
                console.error(`Erro ao processar deployment ${d.id}: ${err.message}`);
              }
            }
            
            console.log(`Limpeza concluída. Total de deployments com falha removidos: ${removidos}`);
